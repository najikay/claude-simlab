  lad-10-5-cbaa:            { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: cbaa }
  lad-10-5-oracle:          { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: oracle }
  lad-10-10-greedy:         { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: greedy }
  lad-10-10-yield:          { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: yield }
  lad-10-10-cbaa:           { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: cbaa }
  lad-10-10-oracle:         { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: oracle }
  lad-10-20-greedy:         { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 20.0, deadline: 20.0, alloc: greedy }
  lad-10-20-yield:          { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 20.0, deadline: 20.0, alloc: yield }
  lad-10-20-cbaa:           { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 20.0, deadline: 20.0, alloc: cbaa }
  lad-10-20-oracle:         { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 20.0, deadline: 20.0, alloc: oracle }
  lad-20-5-greedy:          { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: greedy }
  lad-20-5-yield:           { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: yield }
  lad-20-5-cbaa:            { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: cbaa }
