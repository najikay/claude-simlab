  lad-20-20-cbaa:           { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 20.0, deadline: 20.0, alloc: cbaa }
  lad-20-20-oracle:         { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 20.0, deadline: 20.0, alloc: oracle }
  lad-30-5-greedy:          { agents: 30, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: greedy }
  lad-30-5-yield:           { agents: 30, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: yield }
