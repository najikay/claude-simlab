name: swarm-tasks
description: "Swarm lab — distributed task allocation: tasks appear in the arena with a deadline, agents learn of them by sensing and from neighbours over lossy links, and each must decide which task to go for; compare greedy, a distributed auction, the central oracle (upper bound) and random on served, missed, conflicts and messages per task."
tags: [swarm, multi-agent, allocation, decision, comms]
command: "{python} simlab/worlds/swarm/sim.py --plans-dir {plans_dir} --out {run_dir} --agents {agents} --ticks {ticks} --mission tasks --alloc {alloc} --arena {arena} --decision-every {decision_every} --comm-range {comm_range} --msg-budget {msg_budget} --lambda2-floor {lambda2_floor} --comms {comms} --layout {layout} --sense-range {sense_range} --msg-loss {msg_loss} --msg-latency {msg_latency} --obs-noise {obs_noise} --task-count {task_count} --task-rate {task_rate} --task-size {task_size} --deadline {deadline} --task-radius {task_radius} --shared-map {shared_map} --medium {medium} --vehicle {vehicle} --rate {rate} --seed {seed}"
cwd: "{repo}"
timeout_s: 600
params:
  agents: 6
  ticks: 400
  arena: 40.0
  alloc: greedy          # greedy | greedy-re | yield | auction | cbaa | oracle | random
  decision_every: 5
  comms: range
  layout: none
  sense_range: 6.0       # metres within which an agent notices a task
  comm_range: 12.0
  msg_budget: 0           # messages an agent may send per tick; 0 = one to every neighbour
  lambda2_floor: 0.0      # hold the mission when the agent's own connectivity estimate would drop under this; 0 = off
  msg_loss: 0.0
  msg_latency: 0
  obs_noise: 0.3
  task_count: 8          # tasks present at the start
  task_rate: 2.0         # new tasks per 100 ticks (Poisson); 0 = none
  task_size: 2.0         # seconds an agent must stay at a task
  deadline: 25.0         # seconds after arrival before a task is missed; 0 = no deadline
  task_radius: 1.0
  shared_map: 0           # 0: each agent explores on its own visit map (its beliefs); 1: the true shared map (the older experiments)
  medium: air
  vehicle: point
  rate: 0
  seed: 7
outputs: {}
metrics: [tasks_served, tasks_missed, tasks_open_at_end, served_pct, decided_served_pct, early_served_pct, service_time_mean_s, service_time_p90_s, makespan_s, conflicts, msgs_per_served_task, distance_per_agent_m, msg_loss_pct, connected_pct, mean_lambda2, connectivity_holds_pct]
variants:
  greedy:         { alloc: greedy }
  greedy-re:      { alloc: greedy-re }
  auction:        { alloc: auction }
  oracle:         { alloc: oracle }
  cbaa:           { alloc: cbaa }
  random-control: { alloc: random }
  ideal:          { msg_loss: 0.0, msg_latency: 0 }
  lossy-comms:    { msg_loss: 0.5 }
  delayed-comms:  { msg_latency: 10 }
  short-range:    { comm_range: 6.0 }
  office:         { layout: "plan:office", comms: los }
  no-deadline:    { deadline: 0 }
  busy:           { task_rate: 6.0 }
  auction-ideal:  { alloc: auction, msg_loss: 0.0 }
  auction-lossy:  { alloc: auction, msg_loss: 0.5 }
  greedy-lossy:   { alloc: greedy, msg_loss: 0.5 }
  budget-1:       { msg_budget: 1 }
  budget-2:       { msg_budget: 2 }
  connected-0.1:  { lambda2_floor: 0.1 }
  connected-0.3:  { lambda2_floor: 0.3 }
  connected-0.8:  { lambda2_floor: 0.8 }
  dense:          { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0 }   # the swarm depends on news: tasks arrive faster than one agent finds them
  dense-greedy:   { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: greedy }
  dense-greedy-re: { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: greedy-re }
  dense-yield:    { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: yield }
  dense-auction:  { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: auction }
  dense-cbaa:     { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: cbaa }
  dense-random:   { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: random }
  dense-oracle:   { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, alloc: oracle }
  dense-silent:   { agents: 20, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 10.0, deadline: 20.0, msg_loss: 1.0 }   # no message ever arrives: each agent serves what it senses
  # the density and rate ladder for the sensitivity check (PAPER.md V5)
  lad-10-5-greedy:          { agents: 10, sense_range: 2.5, comm_range: 8.0, task_count: 10, task_rate: 5.0, deadline: 20.0, alloc: greedy }
